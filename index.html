<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111217">
  <title>Dispatch Route Planner</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20212a;
      --muted: #747985;
      --line: #dfe1e6;
      --paper: #fff;
      --canvas: #f0f1f6;
      --navy: #111217;
      --yellow: #ffe52f;
      --yellow-deep: #e9ce00;
      --blue: #3979d6;
      --teal: #22a591;
      --amber: #e8a82a;
      --danger: #b94c40;
      --shadow: 0 1px 2px #1719230b, 0 8px 24px #17192308;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 15px; line-height: 1.5; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-header { color: #f7f7f9; background: var(--navy); }
    .brand-row { display: flex; align-items: center; gap: 18px; max-width: 1220px; min-height: 88px; padding: 15px 28px; margin: 0 auto; }
    .logo { display: grid; place-items: center; flex: 0 0 auto; min-width: 110px; height: 42px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--yellow); color: #161616; font-size: 19px; font-weight: 900; letter-spacing: -.7px; }
    .logo img { max-width: 150px; max-height: 52px; object-fit: contain; }
    .brand-copy { min-width: 0; flex: 1; }
    .brand-copy h1 { margin: 0; font-size: 25px; line-height: 1.25; font-weight: 820; letter-spacing: -.75px; }
    .brand-copy p { margin: 3px 0 0; max-width: 650px; color: #b7bac4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .save-indicator { display: flex; gap: 9px; align-items: center; color: #c3c5cd; white-space: nowrap; }
    .save-dot { width: 11px; height: 11px; border-radius: 50%; background: #f1b64c; }
    .save-dot.saved { background: #6ec6a9; }
    .language-toggle { min-height: 38px; padding: 6px 12px; border: 1px solid #555761; border-radius: 9px; background: transparent; color: #f7f7f9; font-weight: 700; }
    .language-toggle:hover { background: #ffffff12; }
    .tabs { display: flex; gap: 4px; max-width: 1220px; padding: 0 28px; margin: 0 auto; overflow-x: auto; scrollbar-width: thin; }
    .tab { position: relative; flex: 0 0 auto; padding: 14px 20px 16px; border: 0; border-radius: 12px 12px 0 0; background: transparent; color: #c4c5cc; font-size: 16px; font-weight: 700; }
    .tab:hover { color: white; background: #ffffff0b; }
    .tab.active { color: #191919; background: var(--yellow); }
    main { max-width: 1220px; min-height: calc(100vh - 146px); padding: 28px; margin: 0 auto; }
    .notice { padding: 16px 20px; border: 1px solid #e6cfaa; border-radius: 15px; background: #fff1dd; color: #98601b; line-height: 1.55; }
    .notice strong { font-weight: 800; }
    .notice.info { border-color: #d3ddf0; background: #eff5ff; color: #37537c; }
    .notice.error { border-color: #efc8c3; background: #fff0ee; color: #943d34; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 24px 0 20px; }
    h2, h3, h4, p { margin-top: 0; }
    h2 { margin-bottom: 2px; font-size: 28px; line-height: 1.3; letter-spacing: -.6px; }
    h3 { margin-bottom: 7px; font-size: 20px; line-height: 1.35; letter-spacing: -.3px; }
    h4 { margin: 0 0 10px; font-size: 16px; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin: 5px 0 0; font-size: 18px; }
    .date-wrap { min-width: 220px; }
    .date-wrap label { display: block; margin-bottom: 6px; font-weight: 700; }
    input, select { min-height: 43px; width: 100%; padding: 9px 12px; border: 1px solid #cfd2d9; border-radius: 10px; outline: none; background: white; color: var(--ink); }
    input:focus, select:focus { border-color: #8a91a1; box-shadow: 0 0 0 3px #343f5b18; }
    input[type="checkbox"] { width: 18px; min-height: 18px; height: 18px; accent-color: #20212a; }
    input[type="number"] { min-width: 76px; }
    input[type="time"] { min-width: 118px; }
    label { font-weight: 600; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field > span { color: #555a65; font-size: 13px; font-weight: 700; }
    .card { padding: 22px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: var(--shadow); }
    .card + .card { margin-top: 18px; }
    .card-header { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .card-header p { max-width: 780px; margin: 3px 0 0; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 41px; padding: 9px 15px; border: 1px solid #cfd2d9; border-radius: 10px; background: #fff; color: var(--ink); font-weight: 700; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: #f7f7f8; border-color: #aeb2bc; }
    .btn.primary { border-color: var(--yellow); background: var(--yellow); color: #171717; }
    .btn.primary:hover { background: #f3dc19; }
    .btn.danger { color: var(--danger); }
    .btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .before-plan { margin: 20px 0 24px; padding: 16px 20px; border: 1px solid #e6cfaa; border-radius: 15px; background: #fff1dd; color: #98601b; }
    .before-plan strong { display: block; margin-bottom: 6px; }
    .before-plan ul { padding-left: 28px; margin: 0; }
    .before-plan a { color: inherit; }
    .split { display: grid; grid-template-columns: minmax(0,1fr) minmax(320px,.88fr); gap: 18px; }
    .truck-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .truck-toggle { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .truck-toggle.off { opacity: .48; background: #f7f7f8; }
    .empty { padding: 24px; border: 2px dashed #d4d6dc; border-radius: 14px; text-align: center; color: var(--muted); }
    .empty p:last-child { margin-bottom: 0; }
    .empty .btn { margin-top: 8px; }
    .pallet-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .pallet-inputs .field input { font-weight: 700; }
    .order-totals { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .pill { padding: 7px 11px; border-radius: 9px; background: #f1f2f5; color: #545966; font-size: 13px; }
    .pill strong { color: var(--ink); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 10px; border-bottom: 1px solid #eceef1; text-align: left; vertical-align: middle; }
    th { background: #f7f7f9; color: #5f6470; font-size: 12px; letter-spacing: .03em; text-transform: uppercase; }
    td input { min-width: 72px; min-height: 37px; padding: 6px 8px; }
    .orders-table { min-width: 820px; }
    .orders-table td.store-cell { min-width: 175px; }
    .orders-table .order-sub { display: block; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .plan-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; margin-top: 18px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .plan-footer p { margin: 0; color: var(--muted); }
    .plan-footer .btn { min-width: 150px; }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(110px,1fr)); gap: 12px; margin: 18px 0; }
    .stat { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .stat strong { display: block; font-size: 24px; letter-spacing: -.5px; }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .form-grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .form-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    .row-title { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .status-tag { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 99px; background: #e9f5ef; color: #317153; font-size: 12px; font-weight: 700; }
    .status-tag.missing { background: #fff0dd; color: #9a611e; }
    .map-panel { min-height: 420px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #fbfcfe; }
    .map-panel svg { display: block; width: 100%; height: 420px; }
    .map-empty { display: grid; place-items: center; min-height: 260px; padding: 24px; color: var(--muted); text-align: center; }
    .trip-list { display: grid; gap: 14px; }
    .trip-card { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .trip-card-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .trip-card h3 { margin-bottom: 2px; }
    .trip-meta { color: var(--muted); font-size: 13px; }
    .stop-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid #eff0f3; }
    .stop-number { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; background: var(--yellow); font-size: 12px; font-weight: 900; }
    .fill-bar { display: flex; height: 9px; overflow: hidden; margin-top: 14px; border-radius: 99px; background: #eceef2; }
    .fill-bar span { display: block; }
    .guide-layout { display: grid; grid-template-columns: 210px minmax(0,1fr); gap: 22px; align-items: start; }
    .guide-nav { position: sticky; top: 16px; display: grid; gap: 3px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .guide-nav a { padding: 8px 10px; border-radius: 8px; color: #555b68; font-size: 13px; text-decoration: none; }
    .guide-nav a:hover { background: #f3f4f6; color: var(--ink); }
    .guide-article section { padding: 22px 24px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 14px; background: white; scroll-margin-top: 16px; }
    .guide-article li { margin: 6px 0; }
    .guide-article p:last-child, .guide-article ul:last-child { margin-bottom: 0; }
    .notice-line { min-height: 22px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .notice-line.error { color: var(--danger); }
    .hidden { display: none !important; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 20px; background: #12131ab3; }
    .modal { width: min(540px,100%); padding: 24px; border-radius: 18px; background: white; box-shadow: 0 24px 80px #0004; }
    .modal h3 { margin-bottom: 6px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
    [dir="rtl"] .toolbar, [dir="rtl"] .form-actions { justify-content: flex-start; }
    [dir="rtl"] .before-plan ul { padding-right: 28px; padding-left: 0; }
    @media (max-width: 780px) {
      .brand-row { min-height: 78px; padding: 12px 16px; gap: 12px; }
      .logo { min-width: 78px; height: 36px; font-size: 16px; }
      .brand-copy h1 { font-size: 19px; }
      .brand-copy p { max-width: 48vw; font-size: 12px; }
      .save-indicator { font-size: 0; gap: 0; }
      .save-dot { width: 10px; height: 10px; }
      .tabs { padding: 0 12px; }
      .tab { padding: 12px 13px 14px; font-size: 14px; }
      main { padding: 18px 14px 36px; }
      .page-heading { align-items: start; }
      h2 { font-size: 24px; }
      .subtitle { font-size: 16px; }
      .date-wrap { min-width: 150px; }
      .split { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .form-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .guide-layout { grid-template-columns: 1fr; }
      .guide-nav { position: static; display: flex; overflow-x: auto; }
      .guide-nav a { flex: 0 0 auto; }
    }
    @media (max-width: 480px) {
      .brand-row { flex-wrap: wrap; }
      .brand-copy { flex-basis: calc(100% - 105px); }
      .save-indicator { display: none; }
      .page-heading { flex-direction: column; }
      .date-wrap { width: 100%; }
      .card { padding: 18px 15px; }
      .card-header { flex-direction: column; }
      .pallet-inputs, .form-grid, .form-grid.two { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .plan-footer { align-items: stretch; flex-direction: column; }
      .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <div id="brandLogo" class="logo">minutes</div>
      <div class="brand-copy">
        <h1>Dispatch Route Planner</h1>
        <p id="warehouseSubtitle">Industrial Zone, 6th of October City (2) · Ambient + Frozen/Chilled</p>
      </div>
      <div class="save-indicator"><span id="saveDot" class="save-dot"></span><span id="saveText">Saved on this device</span></div>
      <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch language">العربية</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Planner sections">
      <button class="tab active" data-tab="today" role="tab" aria-selected="true">Today’s plan</button>
      <button class="tab" data-tab="routes" role="tab" aria-selected="false">Routes &amp; map</button>
      <button class="tab" data-tab="drivers" role="tab" aria-selected="false">Driver run sheets</button>
      <button class="tab" data-tab="stores" role="tab" aria-selected="false">Stores</button>
      <button class="tab" data-tab="fleet" role="tab" aria-selected="false">Fleet</button>
      <button class="tab" data-tab="settings" role="tab" aria-selected="false">Settings</button>
      <button class="tab" data-tab="guide" role="tab" aria-selected="false">Guide</button>
    </nav>
  </header>
  <main id="main"></main>
  <div id="modalRoot"></div>
  <script src="./dist/app.js" defer></script>
</body>
</html>
